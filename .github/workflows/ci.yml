name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LINDERA_BUILD_DICTIONARY_CACHE_DIR: ${{ github.workspace }}/.lindera-dict-cache

jobs:
  test:
    name: fmt + clippy + test + python
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Lindera dictionaries
        uses: actions/cache@v4
        with:
          path: ${{ env.LINDERA_BUILD_DICTIONARY_CACHE_DIR }}
          key: lindera-dicts-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bench dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r benches/requirements.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Python tests
        run: python -m unittest discover -s benches/tests -t benches

  e2e:
    name: e2e (real binary)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Lindera dictionaries
        uses: actions/cache@v4
        with:
          path: ${{ env.LINDERA_BUILD_DICTIONARY_CACHE_DIR }}
          key: lindera-dicts-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: E2E tests (aria-memo binary)
        run: cargo test --locked -p aria-memo --test cli_binary

  coverage:
    name: coverage (cargo llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Lindera dictionaries
        uses: actions/cache@v4
        with:
          path: ${{ env.LINDERA_BUILD_DICTIONARY_CACHE_DIR }}
          key: lindera-dicts-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --workspace --summary-only --show-missing-lines
