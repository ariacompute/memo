[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/embed",
    "crates/memory",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ariacompute/memory"

[workspace.dependencies]
memory-core = { path = "crates/core" }
memory-storage = { path = "crates/storage" }
memory-embed = { path = "crates/embed" }
memory = { path = "crates/memory" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
