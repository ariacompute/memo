[package]
name = "aria-memo"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aria-memo"
path = "src/main.rs"

[dependencies]
memo.workspace = true
memo-core.workspace = true
memo-embed.workspace = true
memo-storage.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# eMudhra/emSign CA key compromise (2026-10): webpki-roots 1.0.10+ removes the
# compromised emSign roots from the rustls trust store used by reqwest's rustls-tls
# (aria-memo upgrade --url and any outbound HTTPS).
webpki-roots = "1.0.10"
tar = "0.4"
flate2 = "1"
zip = "2"
