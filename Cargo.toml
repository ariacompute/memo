[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/embed",
    "crates/memo",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ariacompute/memo"

[workspace.dependencies]
memo-core = { path = "crates/core" }
memo-storage = { path = "crates/storage" }
memo-embed = { path = "crates/embed" }
memo = { path = "crates/memo" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
